spring.application.name=hms-backend
server.port=${PORT:8080}

# MySQL connection - values come from environment variables when deployed
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate (JPA provider): creates/updates tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Allowed frontend origins (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.error.include-message=always
